name: Publicar demo de Refugio en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_public_evaluation:
        description: 'Publicar demo pública de evaluación, solo datos ficticios, sin validación clínica'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: ${{ github.event_name == 'push' || inputs.confirm_public_evaluation == true }}
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/configure-pages@v5
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefacto verificado
        id: deployment
        uses: actions/deploy-pages@v4
