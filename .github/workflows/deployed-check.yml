name: Probar sitio público de Refugio
on:
  push:
    branches: [fix/live-plan-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.deployed.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-sitio-publico
          path: |
            playwright-report/
            test-results/
          retention-days: 7
